[pytest]
asyncio_mode = auto
; The app's DB engine is a module-level singleton created once at import time,
; bound to whatever event loop is running then. Pytest-asyncio's default is a
; fresh loop per test, which breaks that engine with "attached to a different
; loop" errors - pin everything to one session-wide loop instead.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
